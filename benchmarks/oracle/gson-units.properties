# One javac task per Maven module. sources: corpus-relative roots whose files are compiled and scored.
# sourcepath: corpus-relative roots of sibling modules the module depends on, read for resolution only.
# generated: roots under the module's folder in the Maven build copy (generated code), read for resolution only.
# The classpath is <build>/<module>/cp.txt, written by `mvn dependency:build-classpath`.
gson.sources=gson/src/main/java,gson/src/main/java-templates,gson/src/test/java
extras.sources=extras/src/main/java,extras/src/test/java
extras.sourcepath=gson/src/main/java,gson/src/main/java-templates
metrics.sources=metrics/src/main/java
metrics.sourcepath=gson/src/main/java,gson/src/main/java-templates
proto.sources=proto/src/main/java,proto/src/test/java
proto.sourcepath=gson/src/main/java,gson/src/main/java-templates
proto.generated=target/generated-test-sources/protobuf
test-graal-native-image.sources=test-graal-native-image/src/test/java
