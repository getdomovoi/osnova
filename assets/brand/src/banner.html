<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>osnova README banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
:root { --bg: #0D0E0F; --line: #232528; --ink: #E8E6E3; --muted: #9A9894; --brass: #C89B4A; --slate: #6FA3A8; }
:root[data-theme="light"] { --bg: #F5F3EF; --line: #DEDAD2; --ink: #17181A; --muted: #5C5A56; --brass: #8A5F16; --slate: #2E5F66; }
html, body { margin: 0; }
body { width: 1200px; height: 300px; overflow: hidden; background: var(--bg); font-family: "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
.frame { position: relative; box-sizing: border-box; width: 1200px; height: 300px; display: flex; align-items: center; gap: 40px; padding: 0 72px; }
.plinth { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--brass); }
.mark { color: var(--brass); display: inline-flex; }
.mark svg { width: 104px; height: 104px; }
.rule { width: 1px; height: 104px; background: var(--line); }
.lockup { display: flex; flex-direction: column; gap: 14px; }
.wordmark { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.025em; color: var(--ink); }
.tagline { font-size: 24px; color: var(--muted); }
.aside { margin-left: auto; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; font-family: "JetBrains Mono", monospace; }
.cmd { font-size: 18px; color: var(--slate); }
.meta { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<script>if (location.search.includes("light")) document.documentElement.dataset.theme = "light";</script>
<div class="frame">
  <div class="plinth"></div>
  <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4.4" y="2.6" width="3.1" height="17.9" rx="0.4"/><rect x="10.45" y="5.6" width="3.1" height="14.9" rx="0.4"/><rect x="16.5" y="4.1" width="3.1" height="16.4" rx="0.4"/><rect x="1.6" y="10.9" width="20.8" height="2.6" rx="0.4"/><rect x="1.6" y="17.4" width="20.8" height="3.1" rx="0.4"/></svg></span>
  <div class="rule"></div>
  <div class="lockup">
    <div class="wordmark">osnova</div>
    <div class="tagline">A deterministic code map for AI coding agents</div>
  </div>
  <div class="aside">
    <span class="cmd">npx @getdomovoi/osnova init</span>
    <span class="meta">10 tools · MCP and CLI</span>
  </div>
</div>
</body>
</html>
