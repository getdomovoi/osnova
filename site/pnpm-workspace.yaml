# The site is its own small workspace so its Wrangler pin stays out of the osnova package install.
# An assets-only deploy needs neither install script: workerd serves `wrangler dev`, esbuild bundles Worker code.
allowBuilds:
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0
