name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/check-package.mjs
      - run: node scripts/package-smoke.mjs
      - run: node scripts/clean-install-smoke.mjs
      - run: node scripts/perf.mjs

  node-floor:
    name: package (ubuntu-latest, node 22.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-package.mjs
      - run: node scripts/package-smoke.mjs
      - run: node scripts/clean-install-smoke.mjs
      - run: node dist/bin.js build . --cache-dir "$RUNNER_TEMP/osnova-floor-cache"
