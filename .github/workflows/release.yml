name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag v$tag does not match package.json $version"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-package.mjs
      - run: node scripts/package-smoke.mjs
      - run: node scripts/clean-install-smoke.mjs
      - run: pnpm perf
      - name: Upgrade npm for trusted publishing (OIDC needs npm 11.5 or newer)
        run: npm install -g npm@latest && npm --version
      - name: Changelog must have a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -r CHANGELOG.md || { echo "CHANGELOG.md is missing or unreadable"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## " v "($| )" { inside = 1; next }
            /^## / { inside = 0 }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - run: npm publish --access public --provenance --ignore-scripts
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
