name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag v$tag does not match package.json $version"; exit 1; }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-package.mjs
      - run: node scripts/package-smoke.mjs
      - run: node scripts/clean-install-smoke.mjs
      - run: pnpm perf
      - name: Changelog must have a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -r CHANGELOG.md || { echo "CHANGELOG.md is missing or unreadable"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## " v "($| )" { inside = 1; next }
            /^## / { inside = 0 }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - name: Pack the verified build
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mv release-notes.md release/
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      # Node 24.21.0 bundles npm 11.19.0; trusted publishing through OIDC needs npm 11.5.1 or newer.
      # Pinning the runtime keeps this job from installing any package before it holds the publish token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: npm must support trusted publishing
        run: |
          current="$(npm --version)"
          lowest="$(printf '%s\n%s\n' 11.5.1 "$current" | sort -V | head -n1)"
          test "$lowest" = 11.5.1 || { echo "npm $current is older than 11.5.1"; exit 1; }
          echo "npm $current"
      - name: Publish the tarball the verify job built
        run: |
          tarballs=(release/*.tgz)
          test "${#tarballs[@]}" -eq 1 || { echo "expected one tarball, found ${#tarballs[@]}"; exit 1; }
          npm publish "${tarballs[0]}" --access public --provenance --ignore-scripts
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release/release-notes.md --verify-tag
